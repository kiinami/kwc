name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ci-only
  DJANGO_DEBUG: "false"
  KWC_WALLPAPER_ROOT: ${{ github.workspace }}/data/wallpapers

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d  # v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run --group dev ruff check --no-fix .

      - name: Ruff format check
        run: uv run --group dev ruff format --check .

  django-checks:
    name: Django checks (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [browser, manager]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d  # v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install only this app's dependencies
        run: uv sync --frozen --group dev --package ${{ matrix.app }}

      - name: Run Django checks
        run: uv run --group dev --package ${{ matrix.app }} python apps/${{ matrix.app }}/manage.py check

  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [browser, manager]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
