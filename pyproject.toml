[project]
name = "kwc"
version = "0.1.0"
description = "Wallpaper collection"
readme = "README.md"
authors = [
    { name = "kiinami", email = "kinami@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "browser",
    "filesystem",
    "manager",
    "media",
    "tmdb",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.1.2",
    "prek>=0.5.6",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "responses>=0.25",
    "ruff>=0.17.1",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "libs/*",
]

[tool.uv.sources]
browser = { workspace = true }
manager = { workspace = true }
filesystem = { workspace = true }
media = { workspace = true }
tmdb = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "T20", "SIM", "PL", "RUF"]
ignore = [
    "PLR2004",  # magic-value-comparison - common pattern in Django
    "PLR0911",  # too-many-return-statements - style preference
    "PLR0912",  # too-many-branches - style preference
    "PLR0915",  # too-many-statements - style preference
    "PLW2901",  # redefined-loop-name - intentional in some cases
    "PLC0415",  # import-outside-top-level - intentional for lazy loading
    "RUF012",   # mutable-class-default - mostly in auto-generated migrations
    "SIM117",   # multiple-with-statements - style preference
]

[tool.ruff.lint.isort]
known-first-party = ["browser", "manager", "filesystem", "media", "tmdb"]

[tool.ruff.format]
quote-style = "double"
