[project]
name = "media"
version = "0.1.0"
description = "Image formats, hashes, and embedded metadata"
readme = "README.md"
authors = [
    { name = "kiinami", email = "kinami@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0",
    "pillow-avif-plugin>=1.4",
    "pillow-jxl-plugin>=1.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
