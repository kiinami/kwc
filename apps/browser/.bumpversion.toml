[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
tag = true
tag_name = "browser-v{new_version}"
tag_message = "Release browser {new_version}"
allow_dirty = false
commit = true
message = "chore(browser): bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "{repo_root}/uv.lock"
search = "name = \"browser\"\nversion = \"{current_version}\""
replace = "name = \"browser\"\nversion = \"{new_version}\""
