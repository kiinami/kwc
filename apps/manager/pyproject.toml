[project]
name = "manager"
version = "0.1.0"
description = "Wallpaper manager"
readme = "README.md"
authors = [
    { name = "kiinami", email = "kinami@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-allauth[socialaccount]>=65.20.0",
    "gunicorn>=23.0.0",
    "python-dotenv>=1.0.0",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
