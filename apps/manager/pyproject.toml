[project]
name = "manager"
version = "1.0.0"
description = "Wallpaper manager"
readme = "README.md"
authors = [
    { name = "kiinami", email = "kinami@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1",
    "django-allauth[socialaccount]>=65.20.0",
    "filesystem",
    "gunicorn>=23.0.0",
    "media",
    "python-dotenv>=1.0.0",
    "tmdb",
    "whitenoise>=6.12.0",
]

[tool.uv.sources]
filesystem = { workspace = true }
media = { workspace = true }
tmdb = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
